<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - LabTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-slate-100 p-8">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-xl">L</div>
            <div>
                <h1 class="text-xl font-bold text-slate-900">LabTrack</h1>
                <p class="text-xs text-slate-500">Lab Management System</p>
            </div>
        </div>

        <h2 class="text-2xl font-bold text-slate-800 mb-1">Đăng ký tài khoản</h2>
        <p class="text-sm text-slate-500 mb-6">Tài khoản mới mặc định có vai trò Thành viên (Member)</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for cat, msg in messages %}
            <div class="mb-4 p-3 rounded-lg text-sm bg-red-50 text-red-600">{{ msg }}</div>
          {% endfor %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Họ và tên (Full Name)</label>
                <input type="text" name="full_name" required placeholder="Nguyễn Văn A"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email đăng nhập</label>
                <input type="email" name="email" required placeholder="vana@sis.hust.edu.vn"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mã số sinh viên (MSSV)</label>
                <input type="text" name="student_id" required placeholder="20231234"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mật khẩu</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit"
                    class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition shadow-sm">
                Tạo tài khoản
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            Đã có tài khoản?
            <a href="{{ url_for('login') }}" class="text-indigo-600 font-semibold hover:underline">Đăng nhập</a>
        </p>
    </div>
</body>
</html>
